PROMPT_ROLE: |
    You are an expert in analyzing complex C programs with RISC-V Vector intrinsics.

PROMPT_CODE: |
  You are given a C function that uses RISC-V vector intrinsics.
  Your task is to automatically check and correct the code to make it safe, well-defined, and robust, without changing its core semantics.

  Follow these steps carefully:

  **Step 1: Understand intrinsic semantics**
  - Parse the function and identify each RISC-V intrinsic (e.g., vle, vse, vadd, vlseg, etc.).
  - Determine the expected operand types, data widths (e8/e16/e32/e64), and required alignment constraints.
  - Infer the valid range for `vl` and the necessary alignment boundary based on the intrinsic element width and vector type.

  **Step 2: Derive parameter constraints**
  - From the intrinsic semantics, infer:
    - Valid address alignment (e.g., 4-byte alignment for `vle32`/`vse32`, 1-byte for `vle8`, etc.).
    - Safe range for `vl` according to the element type and hardware capacity.
    - Pointers that must not be null or misaligned.

  **Step 3: Apply validation and correction**
  - Check all pointer arguments (`src`, `dst`, etc.) and return safely if any are null.
  - Clamp `vl` to a valid, nonzero range (`0 < vl ≤ MAX_VL`).
  - Align all relevant addresses down to the nearest valid boundary using bit masking (e.g., `addr & ~(alignment - 1)`).
  - Use the correct `__riscv_vsetvl_*` intrinsic to ensure `vl` is hardware-safe and consistent with element type.

  **Step 4: Generate the corrected version**
  - Produce clean, compilable C code.
  - Do not include any comments, printing, logging, or explanations.
  - Preserve the original computation logic exactly, only adding checks and safe corrections.

  Example:

  Given the program:
  ```c
  #include <riscv_vector.h>
  int add_vec(const int32_t *a, const int32_t *b, int32_t *out, size_t vl) {{
    vint32m4_t va = __riscv_vle32_v_i32m4(a, vl);
    vint32m4_t vb = __riscv_vle32_v_i32m4(b, vl);
    __riscv_vse32_v_i32m4(out, __riscv_vadd_vv_i32m4(va, vb, vl), vl);
    return 0;
  }}
  ```

  Convert it to the safe function:
  ```c
  #include <riscv_vector.h>
  #include <stddef.h>
  #include <stdint.h>
  int add_vec(const int32_t *a, const int32_t *b, int32_t *out, size_t vl) {{
    if (!a || !b || !out) return -1;
    const size_t MAX_VL = 256;
    if (vl == 0) return 0;
    if (vl > MAX_VL) vl = MAX_VL;
    uintptr_t a_addr = (uintptr_t)a & ~((uintptr_t)0x3);
    uintptr_t b_addr = (uintptr_t)b & ~((uintptr_t)0x3);
    uintptr_t o_addr = (uintptr_t)out & ~((uintptr_t)0x3);
    const int32_t *sa = (const int32_t *)a_addr;
    const int32_t *sb = (const int32_t *)b_addr;
    int32_t *so = (int32_t *)o_addr;
    vl = __riscv_vsetvl_e32m4(vl);
    vint32m4_t va = __riscv_vle32_v_i32m4(sa, vl);
    vint32m4_t vb = __riscv_vle32_v_i32m4(sb, vl);
    __riscv_vse32_v_i32m4(so, __riscv_vadd_vv_i32m4(va, vb, vl), vl);
    return 0;
  }}
  ```

